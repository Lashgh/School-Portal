{% extends "base.html" %}

{% block title %}Student Portal — Home{% endblock %}

{% block content %}
<section class="hero">
  <div class="hero__text">
    <h1 class="hero__title">Student Main Portal</h1>
    <p class="hero__tagline">Quick student portal registration — join us today to get started with your enrollment.</p>
    <a href="{{ url_for('enroll') }}" class="btn btn--primary">Get Started</a>
  </div>

  <svg class="hero__art" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a student registration screen">
    <!-- soft background blob -->
    <ellipse cx="200" cy="180" rx="180" ry="150" fill="#DAEEF7"/>

    <!-- screen / portal card -->
    <rect x="90" y="70" width="220" height="200" rx="14" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="2"/>
    <rect x="90" y="70" width="220" height="34" rx="14" fill="#5B2C82"/>
    <circle cx="110" cy="87" r="5" fill="#E2793D"/>
    <circle cx="126" cy="87" r="5" fill="#DAEEF7"/>

    <!-- form lines -->
    <rect x="112" y="122" width="176" height="10" rx="5" fill="#E1E1E8"/>
    <rect x="112" y="146" width="140" height="10" rx="5" fill="#E1E1E8"/>
    <rect x="112" y="170" width="176" height="10" rx="5" fill="#E1E1E8"/>
    <rect x="112" y="194" width="100" height="10" rx="5" fill="#E1E1E8"/>

    <!-- submit button on the card -->
    <rect x="112" y="222" width="90" height="26" rx="6" fill="#E2793D"/>

    <!-- checkmark badge -->
    <circle cx="255" cy="235" r="24" fill="#2F8F5D"/>
    <path d="M245 235l7 7 14 -14" stroke="#FFFFFF" stroke-width="4" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- graduation cap -->
    <g transform="translate(255 30)">
      <polygon points="0,10 40,0 80,10 40,20" fill="#5B2C82"/>
      <rect x="36" y="18" width="8" height="16" fill="#7C4FA0"/>
    </g>
  </svg>
</section>
{% endblock %}
